server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Configurations additionnelles montées selon l'environnement (ex : redirection /api)
  include /etc/nginx/extra/*.conf;

  # index.html doit toujours être revalidé : c'est lui qui référence les bundles de la version courante.
  # Sans ça, le navigateur peut le garder en cache et exécuter une ancienne version de l'application.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # Fichiers générés par le build avec un hash dans le nom (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css) :
  # leur contenu ne change jamais pour un nom donné, on peut les mettre en cache indéfiniment
  location ~* "^/(main|chunk|polyfills|styles)-[A-Z0-9]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
